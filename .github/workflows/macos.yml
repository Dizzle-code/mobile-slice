# Builds the macOS app (engine + Flutter) on a GitHub-hosted Apple Silicon Mac.
# Result: artifact "Mobile-Slice-macOS" with a zipped "Mobile Slice.app".
# The first run builds the engine dependencies (1-3 h) and caches them; later runs reuse them.
name: macOS

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "engine/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      OSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7

      - name: Werkzeuge
        run: brew install autoconf automake libtool texinfo

      # Boost and other pinned dependencies do not configure with CMake 4.
      - uses: lukka/get-cmake@v4.5.1
        with:
          cmakeVersion: "~3.31.0"

      - name: Engine-Version
        id: engine
        run: |
          source engine/VERSIONS
          echo "commit=$ENGINE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Only the installed dependency prefix is cached; it depends on the engine commit, not on app code.
      - name: Abhängigkeiten aus dem Cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/build/orca-desktop/deps/build/${{ steps.engine.outputs.arch }}/OrcaSlicer_dep
          key: orca-deps-macos-${{ steps.engine.outputs.arch }}-${{ env.OSX_DEPLOYMENT_TARGET }}-${{ steps.engine.outputs.commit }}-v1

      - name: Abhängigkeiten bauen
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ENGINE_ONLY_DEPS=1 engine/build-macos.sh

      - name: Abhängigkeiten cachen
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/build/orca-desktop/deps/build/${{ steps.engine.outputs.arch }}/OrcaSlicer_dep
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Engine bauen
        run: ENGINE_SKIP_DEPS=1 engine/build-macos.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Tests (inklusive echter Engine)
        working-directory: app
        run: |
          flutter pub get
          flutter test

      - name: App bauen
        working-directory: app
        run: |
          flutter build macos --release
          APP="build/macos/Build/Products/Release/Mobile Slice.app"
          test -x "$APP/Contents/Resources/engine/slicer_cli"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Mobile-Slice-macOS.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Mobile-Slice-macOS
          path: ${{ runner.temp }}/Mobile-Slice-macOS.zip
          retention-days: 30
